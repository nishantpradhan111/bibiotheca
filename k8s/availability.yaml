apiVersion: apps/v1
kind: Deployment
metadata:
  name: availability
  namespace: library
spec:
  replicas: 1
  selector:
    matchLabels: {app: availability}
  template:
    metadata:
      labels: {app: availability}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8007"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: availability
          image: "072718160501.dkr.ecr.us-east-1.amazonaws.com/digital-library-dev/availability@sha256:e4377c9cb707470cadc122d3f646de34b19e064b751f308d073cacf33f643197"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8007
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: availability-database
                  key: url
            - name: CATALOG_URL
              value: http://catalog:80
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /ready, port: http}
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: rds-ca
              mountPath: /etc/rds-ca
              readOnly: true
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 100Mi
        - name: rds-ca
          configMap:
            name: rds-ca
---
apiVersion: v1
kind: Service
metadata:
  name: availability
  namespace: library
spec:
  selector: {app: availability}
  ports:
    - name: http
      port: 80
      targetPort: http
