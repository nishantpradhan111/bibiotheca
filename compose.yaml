services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: local-password
      POSTGRES_DB: library
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 3s
      timeout: 3s
      retries: 20

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "127.0.0.1:8000:8000"

  minio:
    image: library-minio:local
    build:
      context: ./scripts/minio
      target: server
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-admin
      MINIO_ROOT_PASSWORD: local-admin-password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: library-minio-client:local
    build:
      context: ./scripts/minio
      target: client
    depends_on:
      - minio
    volumes:
      - ./scripts/minio-policy.json:/policy.json:ro
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        attempts=0
        until mc alias set local http://minio:9000 local-admin local-admin-password; do
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 30 ] || exit 1
          sleep 1
        done
        mc mb --ignore-existing local/library-covers
        mc anonymous set none local/library-covers
        mc admin user add local local-library local-library-password
        mc admin policy create local catalog-covers /policy.json
        mc admin policy attach local catalog-covers --user local-library

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic library.events.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic library.analytics.results.v1 --partitions 3 --replication-factor 1

  member-init:
    image: python:3.12-slim
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://library:local-password@postgres:5432/library
    volumes:
      - ./services/member:/app:ro
      - member-python:/venv
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        python -m venv /venv
        /venv/bin/pip install --disable-pip-version-check -r requirements-dev.txt
        /venv/bin/python init_db.py

  member:
    extends:
      service: member-init
    depends_on:
      member-init:
        condition: service_completed_successfully
    command: /venv/bin/python -m uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog-init:
    image: python:3.12-slim
    working_dir: /app
    environment:
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./services/catalog:/app:ro
      - catalog-python:/venv
    depends_on:
      dynamodb:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - |
        python -m venv /venv
        /venv/bin/pip install --disable-pip-version-check -r requirements-dev.txt
        /venv/bin/python init_db.py

  catalog:
    extends:
      service: catalog-init
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    command: /venv/bin/python -m uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8002
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20

  reservation:
    build: ./services/reservation
    environment:
      DATABASE_URL: postgresql+psycopg://library:local-password@postgres:5432/library
      MEMBER_URL: http://member:8001
      AVAILABILITY_URL: http://availability:8007
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: library.events.v1
    depends_on:
      postgres:
        condition: service_healthy
      member:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
    ports:
      - "127.0.0.1:8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20

  lending:
    build: ./services/lending
    environment:
      DATABASE_URL: postgresql+psycopg://library:local-password@postgres:5432/library
      MEMBER_URL: http://member:8001
      CATALOG_URL: http://catalog:8002
      RESERVATION_URL: http://reservation:8003
      NOTIFICATION_URL: http://notification:8004
      LOAN_PERIOD_DAYS: "14"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: library.events.v1
    depends_on:
      postgres:
        condition: service_healthy
      member:
        condition: service_healthy
      catalog:
        condition: service_healthy
      reservation:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8006:8006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20

  availability:
    build: ./services/availability
    environment:
      DATABASE_URL: postgresql+psycopg://library:local-password@postgres:5432/library
      CATALOG_URL: http://catalog:8002
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_healthy
      reservation:
        condition: service_healthy
      lending:
        condition: service_healthy
    ports:
      - "127.0.0.1:8007:8007"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20

  fine:
    build: ./services/fine
    environment:
      DATABASE_URL: postgresql+psycopg://library:local-password@postgres:5432/library
      FINE_PER_DAY_CENTS: "100"
    depends_on:
      postgres:
        condition: service_healthy
      lending:
        condition: service_healthy
    ports:
      - "127.0.0.1:8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20

  notification:
    build: ./services/notification
    ports:
      - "127.0.0.1:8004:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  minio-data:
  member-python:
  catalog-python:
